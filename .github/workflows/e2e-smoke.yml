name: E2E Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "Dockerfile"
      - "nginx.conf"
      - "docker-compose.yml"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/e2e-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "Dockerfile"
      - "nginx.conf"
      - "docker-compose.yml"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/e2e-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build and start
        run: docker compose up -d --build

      - name: Wait for web app
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8088/ >/dev/null 2>&1; then
              echo "Webapp ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Webapp did not respond within 60s"
          docker compose logs | tail -50
          exit 1

      - name: Smoke check - static assets and security headers
        run: |
          echo "=== HTML content ==="
          curl -fsS http://localhost:8088/ | grep -qE "<html" && echo "OK: HTML served"
          echo ""
          echo "=== Security headers ==="
          curl -fsSI http://localhost:8088/ | grep -iE "(x-content-type-options|x-frame-options|content-security-policy)"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs | tail -100

      - name: Teardown
        if: always()
        run: docker compose down -v
