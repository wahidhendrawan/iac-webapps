name: Upload SARIF to GitHub Security

on:
  # On push to main or release branches, attempt to scan local IaC files
  push:
    branches:
      - main
      - 'release/**'
      - 'v*'
  # Manual trigger for ad-hoc uploads
  workflow_dispatch:
    inputs:
      upload_sarif:
        type: boolean
        description: 'Upload SARIF file to GitHub Security'
        required: false
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  generate-sarif:
    name: Generate and upload SARIF results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Scan local IaC files for security issues
        id: scan-iac
        run: |
          set -euo pipefail
          mkdir -p sarif-results
          OUT=sarif-results/iac-security.sarif

          # Rules catalog shared by all runs.
          RULES='[
            {"id":"s3-public-access","name":"S3 Public Access","shortDescription":{"text":"S3 bucket has public read/write access."},"properties":{"category":"Security","security-severity":"8.0","precision":"high"}},
            {"id":"unencrypted-s3","name":"Unencrypted S3 Bucket","shortDescription":{"text":"S3 bucket might be missing encryption."},"properties":{"category":"Security","security-severity":"5.0","precision":"high"}},
            {"id":"no-iac-files","name":"No IaC Files","shortDescription":{"text":"Repository contains no Terraform files to scan."},"properties":{"category":"IaC","security-severity":"1.0","precision":"high"}}
          ]'

          # Collect Terraform files (space/newline safe).
          mapfile -t TERRAFORM_FILES < <(find . -type f \( -name "*.tf" -o -name "*.tfvars" \) 2>/dev/null || true)

          RESULTS='[]'

          if [ "${#TERRAFORM_FILES[@]}" -eq 0 ]; then
            echo "No Terraform files found; emitting placeholder result."
            RESULTS=$(jq -n '[{
              ruleId: "no-iac-files",
              level: "note",
              message: { text: "Repository contains no Terraform files to scan." },
              locations: [{
                physicalLocation: {
                  artifactLocation: { uri: "." },
                  region: { startLine: 1, startColumn: 1 }
                }
              }]
            }]')
          else
            for tf_file in "${TERRAFORM_FILES[@]}"; do
              [ -f "$tf_file" ] || continue
              rel="${tf_file#./}"

              # S3 public access.
              if grep -Eq 'acl[[:space:]]*=[[:space:]]*["'"'"']public-read' "$tf_file" 2>/dev/null; then
                echo "Found S3 public access in $tf_file"
                RESULTS=$(printf '%s' "$RESULTS" | jq --arg file "$rel" '. += [{
                  ruleId: "s3-public-access",
                  level: "error",
                  message: { text: "S3 bucket has public read access." },
                  locations: [{
                    physicalLocation: {
                      artifactLocation: { uri: $file },
                      region: { startLine: 1, startColumn: 1 }
                    }
                  }]
                }]')
              fi

              # S3 without encryption.
              if grep -q 'resource "aws_s3_bucket"' "$tf_file" 2>/dev/null \
                 && ! grep -q 'server_side_encryption_configuration' "$tf_file" 2>/dev/null; then
                echo "Found S3 without encryption in $tf_file"
                RESULTS=$(printf '%s' "$RESULTS" | jq --arg file "$rel" '. += [{
                  ruleId: "unencrypted-s3",
                  level: "warning",
                  message: { text: "S3 bucket might be missing server-side encryption." },
                  locations: [{
                    physicalLocation: {
                      artifactLocation: { uri: $file },
                      region: { startLine: 1, startColumn: 1 }
                    }
                  }]
                }]')
              fi
            done
          fi

          # Assemble the final SARIF document with jq so it is always valid.
          jq -n \
            --argjson rules "$RULES" \
            --argjson results "$RESULTS" \
            '{
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              version: "2.1.0",
              runs: [{
                tool: {
                  driver: {
                    name: "iac-security-scanner",
                    version: "1.0.0",
                    informationUri: "https://github.com/wahidhendrawan/iac-webapps",
                    rules: $rules
                  }
                },
                artifacts: [],
                results: $results
              }]
            }' > "$OUT"

          echo "Generated SARIF:"
          jq '.runs[0].results | length' "$OUT"
          echo "sarif_path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to GitHub Security
        if: steps.scan-iac.outputs.sarif_path != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan-iac.outputs.sarif_path }}
          category: 'iac-security-scan'

      - name: Summary
        run: |
          echo "✅ SARIF processing complete"
          echo "📊 Findings will appear in the repository's Security tab if SARIF contains results"
          echo "🔗 View at: https://github.com/${{ github.repository }}/security/code-scanning"
