name: Bug report
description: Report reproducible unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include credentials, API keys, or security vulnerabilities here. Report security issues privately as described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clearly describe the unexpected behavior and its impact.
      placeholder: The application ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser and version, operating system, app version or commit, and Node.js version if running locally.
      placeholder: |
        Browser: Chrome 123
        OS: macOS 14
        App version/commit: v1.7.0
        Node.js: 20.x
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, sanitized logs, or a minimal example. Remove sensitive information first.
