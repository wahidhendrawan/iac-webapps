name: Feature request
description: Propose a focused improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Search existing issues first and do not include credentials or sensitive infrastructure information.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need, who is affected, and the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the desired behavior and any relevant user flow or acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches and why they are insufficient.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, links, or examples if useful. Remove sensitive information first.
