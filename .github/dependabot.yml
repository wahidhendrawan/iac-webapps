version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # No grouping - individual PRs prevent conflicts and allow granular review
    ignore:
      - dependency-name: ip-address
        # Bundled within npm itself; cannot be updated directly.
      - dependency-name: npm
        # npm is a tool bundled with Node.js, not a library dependency.

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 3
