version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Individual PRs, except for packages that peer-pin each other: bumped alone
    # they fail `npm ci` with ERESOLVE (e.g. vitest without @vitest/coverage-v8).
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      eslint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*"]
    ignore:
      - dependency-name: ip-address
        # Bundled within npm itself; cannot be updated directly.
      - dependency-name: npm
        # npm is a tool bundled with Node.js, not a library dependency.
      - dependency-name: typescript
        # typescript-eslint peer-requires typescript <6.1; drop once it supports newer.
        versions: [">=6.1.0"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 3
