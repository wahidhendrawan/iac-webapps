pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Disable server version disclosure
    server_tokens off;

    # Security headers (applies to all responses)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    # CSP tuned for Vite + React SPA: allows built-in hashes and self-hosted resources
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Client request size limits (prevent upload DoS)
    client_max_body_size 10m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location / {
        try_files $uri $uri/ /index.html;
        # Keep security headers inherited from the server block. Nginx replaces
        # inherited add_header values when a location declares its own ones.
        expires -1;
    }

    # Fingerprinted static assets (built by Vite with hash in filename).
    # Do not add response headers here: that would hide the security headers
    # declared above on these responses.
    location ~* ^/assets/.*\.(?:js|css)$ {
        expires 1y;
    }

    # Versioned images and fonts.
    location ~* \.(?:ico|gif|jpe?g|png|woff2?|ttf|eot|svg)$ {
        expires 30d;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
}